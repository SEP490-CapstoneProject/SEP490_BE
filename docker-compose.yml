services:
  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - recruitment-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -C || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: src/Services/Auth/Dockerfile
    container_name: auth-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AuthServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # User Profile Service
  userprofile-service:
    build:
      context: .
      dockerfile: src/Services/UserProfile/Dockerfile
    container_name: userprofile-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=UserProfileServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Portfolio Service
  portfolio-service:
    build:
      context: .
      dockerfile: src/Services/Portfolio/Dockerfile
    container_name: portfolio-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PortfolioServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough123456
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - ServiceUrls__MediaService=http://media-service:8080
      - ServiceUrls__UserProfileService=http://userprofile-service:8080
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Company Service
  company-service:
    build:
      context: .
      dockerfile: src/Services/Company/Dockerfile
    container_name: company-service
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CompanyServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Connection & Chat Service
  connection-service:
    build:
      context: .
      dockerfile: src/Services/Connection/Dockerfile
    container_name: connection-service
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ConnectionServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Community Service
  community-service:
    build:
      context: .
      dockerfile: src/Services/Community/Dockerfile
    container_name: community-service
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CommunityServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Subscription & Billing Service
  subscription-service:
    build:
      context: .
      dockerfile: src/Services/Subscription/Dockerfile
    container_name: subscription-service
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SubscriptionServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=your-256-bit-secret-key-here-make-it-long
      - JwtSettings__Issuer=SkillSnapAuth
      - JwtSettings__Audience=SkillSnapUsers
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Redis__ConnectionString=redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Media Upload Service
  media-service:
    build:
      context: .
      dockerfile: src/Services/Media/Dockerfile
    container_name: media-service
    ports:
      - "5012:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CLOUDINARY_CLOUD_NAME=daxvhwsax
      - CLOUDINARY_API_KEY=934663792441256
      - CLOUDINARY_API_SECRET=gKYTnNC8EErJHieYhTjLjzj6L7k
    networks:
      - recruitment-network
    restart: on-failure

  # Interview Service
  interview-service:
    build:
      context: .
      dockerfile: src/Services/Interview/Dockerfile
    container_name: interview-service
    ports:
      - "5013:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=InterviewServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough123456
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - ServiceUrls__UserProfileService=http://userprofile-service:8080
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Moderation Service
  moderation-service:
    build:
      context: .
      dockerfile: src/Services/Notification/Dockerfile
    container_name: notification-service
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=NotificationServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=your-256-bit-secret-key-here-make-it-long
      - JwtSettings__Issuer=SkillSnapAuth
      - JwtSettings__Audience=SkillSnapUsers
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__Port=5672
      - Redis__ConnectionString=redis:6379
      - ServiceUrls__UserProfile=http://userprofile-service:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Application Service
  application-service:
    build:
      context: .
      dockerfile: src/Services/Application/Dockerfile
    container_name: application-service
    ports:
      - "5013:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ApplicationServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=your-256-bit-secret-key-here-make-it-long
      - JwtSettings__Issuer=SkillSnapAuth
      - JwtSettings__Audience=SkillSnapUsers
      - ServiceUrls__UserProfileService=http://userprofile-service:8080
      - ServiceUrls__SubscriptionService=http://subscription-service:8080
      - Redis__ConnectionString=redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      userprofile-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitment-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitment-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - auth-service
      - userprofile-service
    networks:
      - recruitment-network
    restart: on-failure

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: src/Services/Payment/Dockerfile
    container_name: payment-service
    ports:
      - "5014:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PaymentDb=Server=sqlserver;Database=PaymentServiceDb;User Id=sa;Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True;
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - VNPay__TmnCode=${VNPAY_TMN_CODE}
      - VNPay__HashSecret=${VNPAY_HASH_SECRET}
      - VNPay__BaseUrl=${VNPAY_BASE_URL}
      - VNPay__ReturnUrl=${VNPAY_RETURN_URL}
      - VNPay__IpnUrl=${VNPAY_IPN_URL}
      - MoMo__PartnerCode=${MOMO_PARTNER_CODE}
      - MoMo__AccessKey=${MOMO_ACCESS_KEY}
      - MoMo__SecretKey=${MOMO_SECRET_KEY}
      - MoMo__Endpoint=${MOMO_ENDPOINT}
      - MoMo__ReturnUrl=${MOMO_RETURN_URL}
      - MoMo__IpnUrl=${MOMO_IPN_URL}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Port=${RABBITMQ_PORT}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Services__SubscriptionService=${SERVICE_SUBSCRIPTION}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      subscription-service:
        condition: service_started
    networks:
      - recruitment-network
    restart: on-failure

networks:
  recruitment-network:
    driver: bridge

volumes:
  sqlserver_data:
