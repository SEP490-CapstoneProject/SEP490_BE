services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - recruitment-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -C || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: src/Services/Auth/Dockerfile
    container_name: auth-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AuthServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - Azure__KeyVault__Url=
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # User Profile Service
  userprofile-service:
    build:
      context: .
      dockerfile: src/Services/UserProfile/Dockerfile
    container_name: userprofile-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=UserProfileServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Portfolio Service
  portfolio-service:
    build:
      context: .
      dockerfile: src/Services/Portfolio/Dockerfile
    container_name: portfolio-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PortfolioServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - ServiceUrls__MediaService=http://media-service:8080
      - ServiceUrls__UserProfileService=http://userprofile-service:8080
      - Azure__KeyVault__Url=
      # AI provider configuration (local placeholders)
      - AI__Provider=Google
      - AI__Google__ApiKey=
      - AI__Google__Model=gemini-2.5-flash
      - AI__Google__ModelTemperature=0.0
      - GOOGLESEARCH__ApiKey=
      - GOOGLESEARCH__SearchEngineId=
    env_file:
      - ./secrets/google/.env
    volumes:
      - ./secrets/google/:/run/secrets/google/:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Company Service
  company-service:
    build:
      context: .
      dockerfile: src/Services/Company/Dockerfile
    container_name: company-service
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CompanyServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - Azure__KeyVault__Url=
      - DisableAutoMigrations=true
      - DisableBackgroundWorkers=true
      # AI provider configuration (local placeholders)
      - AI__Provider=Google
      - AI__Google__ApiKey=
      - AI__Google__Model=gemini-2.5-flash
      - AI__Google__ModelTemperature=0.0
      - GOOGLESEARCH__ApiKey=
      - GOOGLESEARCH__SearchEngineId=
    env_file:
      - ./secrets/google/.env
    volumes:
      - ./secrets/google/:/run/secrets/google/:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Connection & Chat Service
  connection-service:
    build:
      context: .
      dockerfile: src/Services/Connection/Dockerfile
    container_name: connection-service
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ConnectionServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - Azure__KeyVault__Url=
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Community Service
  community-service:
    build:
      context: .
      dockerfile: src/Services/Community/Dockerfile
    container_name: community-service
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CommunityServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - Azure__KeyVault__Url=
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Subscription & Billing Service
  subscription-service:
    build:
      context: .
      dockerfile: src/Services/Subscription/Dockerfile
    container_name: subscription-service
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SubscriptionServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Redis__ConnectionString=redis:6379
      - Azure__KeyVault__Url=
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: src/Services/Notification/Dockerfile
    container_name: notification-service
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=NotificationServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__Port=5672
      - Redis__ConnectionString=redis:6379
      - ServiceUrls__UserProfile=http://userprofile-service:8080
      - Azure__KeyVault__Url=
      - DisableAutoMigrations=true
      - Firebase__CredentialsPath=/app/firebase-credentials.json
      - Firebase__ProjectId=skillsnap-notification
      # Alternative: set Firebase__CredentialsJson to the full JSON if you prefer env var (not recommended for secrets)
    volumes:
      - ./secrets/firebase/notification-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Media Upload Service
  media-service:
    build:
      context: .
      dockerfile: src/Services/Media/Dockerfile
    container_name: media-service
    ports:
      - "5012:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CLOUDINARY_CLOUD_NAME=daxvhwsax
      - CLOUDINARY_API_KEY=934663792441256
      - CLOUDINARY_API_SECRET=gKYTnNC8EErJHieYhTjLjzj6L7k
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - Azure__KeyVault__Url=
    networks:
      - recruitment-network
    restart: on-failure

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: src/Services/Payment/Dockerfile
    container_name: payment-service
    ports:
      - "5014:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PaymentServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Services__SubscriptionService=http://subscription-service:8080
      - Azure__KeyVault__Url=
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      subscription-service:
        condition: service_started
    networks:
      - recruitment-network
    restart: on-failure

  # Realtime Service
  realtime-service:
    build:
      context: .
      dockerfile: src/Services/Realtime/Dockerfile
    container_name: realtime-service
    ports:
      - "5015:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__Port=5672
      - Redis__ConnectionString=redis:6379
      - Azure__KeyVault__Url=
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Challenge Service
  challenge-service:
    build:
      context: .
      dockerfile: src/Services/Challenge/Dockerfile
    container_name: challenge-service
    ports:
      - "5016:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ChallengeServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Secret=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - Azure__KeyVault__Url=
      # AI provider configuration (local placeholders)
      - AI__Provider=Google
      - AI__Google__ApiKey=
      - AI__Google__Model=gemini-2.5-flash
      - AI__Google__ModelTemperature=0.0
      - GOOGLESEARCH__ApiKey=
      - GOOGLESEARCH__SearchEngineId=
    env_file:
      - ./secrets/google/.env
    volumes:
      - ./secrets/google/:/run/secrets/google/:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # Application Service
  application-service:
    build:
      context: .
      dockerfile: src/Services/Application/Dockerfile
    container_name: application-service
    ports:
      - "5017:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ApplicationServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JwtSettings__SecretKey=HMEw6UwMUhuXg1zp8JdPIzk8rAeqh1eorwNEzOx7HpaNUfsn
      - JwtSettings__Issuer=RecruitmentPlatform
      - JwtSettings__Audience=RecruitmentPlatformUsers
      - ServiceUrls__UserProfileService=http://userprofile-service:8080
      - ServiceUrls__SubscriptionService=http://subscription-service:8080
      - Redis__ConnectionString=redis:6379
      # Disable Azure Key Vault for local development (leave empty)
      - Azure__KeyVault__Url=
    depends_on:
      sqlserver:
        condition: service_healthy
      userprofile-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: on-failure

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitment-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitment-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - auth-service
      - userprofile-service
    networks:
      - recruitment-network
    restart: on-failure

networks:
  recruitment-network:
    driver: bridge

volumes:
  sqlserver_data:
